<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ECHO Suno Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070c; --ink:#f4f4fb; --dim:#a6a6c2; --faint:#65657f;
  --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.07); --stroke:rgba(255,255,255,.09);
  --pink:#ff2d78; --vio:#8b5cf6; --cy:#22d3ee; --ok:#2ce59b; --warn:#ffcf5c;
  --grad:linear-gradient(100deg,#ff2d78,#8b5cf6 55%,#22d3ee);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);
  background-image:
    radial-gradient(720px 380px at 88% -10%,rgba(255,45,120,.20),transparent 60%),
    radial-gradient(620px 420px at 6% 2%,rgba(139,92,246,.20),transparent 60%);
  -webkit-font-smoothing:antialiased;
}
.wrap{position:relative;max-width:1120px;margin:0 auto;padding:16px}
a{color:var(--cy);text-decoration:none}

/* header */
header{display:flex;align-items:center;gap:11px;margin-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;
  box-shadow:0 8px 26px rgba(139,92,246,.5),inset 0 1px 0 rgba(255,255,255,.4);position:relative;overflow:hidden}
.mark::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.25))}
.mark svg{width:22px;height:22px;color:#0a0a12;position:relative;z-index:1}
.wordmark{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1}
.wordmark b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:11px;color:var(--faint);letter-spacing:.03em;margin-top:3px}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:8px;background:var(--glass);backdrop-filter:blur(14px);
  border:1px solid var(--stroke);padding:8px 13px;border-radius:999px;font-size:12.5px;color:var(--dim);white-space:nowrap}
.pill b{font-family:'Bricolage Grotesque',Inter,sans-serif;color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);transition:.3s}
.dot.on{background:var(--ok);box-shadow:0 0 12px var(--ok)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--glass2),var(--glass));backdrop-filter:blur(20px);
  border:1px solid var(--stroke);border-radius:18px;padding:17px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.card h2{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 14px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:20px;height:3px;border-radius:3px;background:var(--grad)}

label{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:13px 0 6px}
input[type=text],textarea,select{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--stroke);color:var(--ink);
  border-radius:12px;padding:11px 13px;font-family:inherit;font-size:14px;outline:none;transition:.16s}
input::placeholder,textarea::placeholder{color:#5a5a72}
input:focus,textarea:focus,select:focus{border-color:var(--vio);box-shadow:0 0 0 4px rgba(139,92,246,.18);background:rgba(0,0,0,.4)}
textarea{min-height:120px;resize:vertical;line-height:1.6;font-size:13.5px}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
.slider{display:flex;align-items:center;gap:11px;height:42px}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;width:100%;
  background:linear-gradient(90deg,var(--vio),var(--cy)) 0/var(--p,75%) 100% no-repeat,rgba(255,255,255,.1)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.6),0 0 0 4px rgba(139,92,246,.3)}
.infl{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:600;min-width:34px;text-align:right;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.toggle{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--dim);font-size:13px;cursor:pointer;user-select:none}
.toggle input{display:none}.sw{width:40px;height:22px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;transition:.22s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.22s}
.toggle input:checked+.sw{background:linear-gradient(90deg,var(--pink),var(--vio))}
.toggle input:checked+.sw::after{left:20px}
.btn{margin-top:18px;width:100%;border:none;cursor:pointer;font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;
  font-size:15px;letter-spacing:.02em;color:#0b0b14;background:var(--grad);background-size:180% 100%;
  padding:14px;border-radius:14px;transition:.2s;box-shadow:0 12px 34px rgba(255,45,120,.3)}
.btn:hover{background-position:100% 0;transform:translateY(-1px)}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.hint{font-size:11.5px;color:var(--faint);margin-top:11px;line-height:1.5}

/* inline player */
.player{display:none;align-items:center;gap:12px;background:linear-gradient(90deg,rgba(255,45,120,.10),rgba(139,92,246,.05));
  border:1px solid rgba(139,92,246,.3);border-radius:14px;padding:10px;margin-bottom:12px}
.player.up{display:flex}
.part{width:46px;height:46px;border-radius:10px;flex-shrink:0;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.part img{width:100%;height:100%;object-fit:cover}
.pmeta{min-width:0;width:150px}
.pmeta .tt{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta .ta{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;background:var(--grad);color:#0b0b14;display:grid;place-items:center;flex-shrink:0;box-shadow:0 8px 22px rgba(255,45,120,.4);transition:.15s}
.play:hover{transform:scale(1.06)}.play svg{width:20px;height:20px}
.prog{flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.time{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;min-width:34px}
.bar{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.12);cursor:pointer;position:relative;overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--grad);border-radius:6px}
.dl{color:var(--dim);border:1px solid var(--stroke);background:var(--glass);border-radius:10px;padding:7px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.dl:hover{color:var(--ink);border-color:var(--vio)}
@media(max-width:620px){.pmeta{width:96px}.dl{display:none}}

/* library */
.libhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mini{background:var(--glass);border:1px solid var(--stroke);color:var(--dim);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:12.5px;transition:.15s;white-space:nowrap}
.mini:hover{color:var(--ink);border-color:var(--vio)}
.tracks{display:flex;flex-direction:column;gap:9px;max-height:min(60vh,520px);overflow:auto;padding-right:4px}
.tracks::-webkit-scrollbar{width:8px}.tracks::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}
.trk{display:flex;gap:12px;align-items:center;padding:8px;border-radius:14px;border:1px solid transparent;cursor:pointer;transition:.15s}
.trk:hover{background:var(--glass);border-color:var(--stroke)}
.trk.playing{background:linear-gradient(90deg,rgba(255,45,120,.12),rgba(139,92,246,.06));border-color:rgba(139,92,246,.35)}
.art{width:54px;height:54px;border-radius:11px;flex-shrink:0;position:relative;overflow:hidden;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.art img{width:100%;height:100%;object-fit:cover}
.art .pl{position:absolute;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:center;opacity:0;transition:.15s}
.trk:hover .art .pl{opacity:1}.art .pl svg{width:20px;height:20px;color:#fff}
.tmeta{flex:1;min-width:0}
.tt{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-top:5px}
.b-queued,.b-submitted{background:rgba(255,207,92,.15);color:var(--warn)}
.b-streaming{background:rgba(34,211,238,.15);color:var(--cy)}
.b-complete{background:rgba(44,229,155,.15);color:var(--ok)}
.b-error{background:rgba(255,45,120,.15);color:var(--pink)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.eq i{width:3px;background:var(--cy);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.spin{width:11px;height:11px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--cy);border-radius:50%;display:inline-block;animation:s .7s linear infinite;vertical-align:-1px}
@keyframes s{to{transform:rotate(360deg)}}
.empty{color:var(--faint);text-align:center;padding:38px 16px;font-size:13.5px}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(20,20,32,.96);
  border:1px solid var(--stroke);padding:11px 18px;border-radius:12px;font-size:13.5px;opacity:0;transition:.28s;pointer-events:none;z-index:60;box-shadow:0 16px 44px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
      <div>
        <div class="wordmark">ECHO <b>Suno Studio</b></div>
        <div class="sub" id="sub">your voice · your tracks</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="pill"><span class="dot" id="hdot"></span><span id="acct">connecting…</span></div>
    <div class="pill">◆ <b id="credits">—</b> credits</div>
  </header>

  <div class="grid">
    <section class="card">
      <h2>Create</h2>
      <label>Title</label>
      <input id="title" type="text" placeholder="COLD GAME" />
      <div class="row">
        <div><label>Voice</label><select id="voice"><option value="">Default singer</option></select></div>
        <div><label>Audio influence</label><div class="slider"><input id="infl" type="range" min="0" max="100" value="75"><span class="infl" id="inflv">75</span></div></div>
      </div>
      <label>Style / tags</label>
      <input id="tags" type="text" placeholder="hardcore west coast, g-funk, heavy 808 bass, aggressive male vocal" />
      <label>Lyrics <span style="color:var(--faint);text-transform:none;letter-spacing:0">— use [Chorus] / [Verse] markers</span></label>
      <textarea id="lyrics" placeholder="[Chorus]&#10;your bars…&#10;&#10;[Verse 1]&#10;…"></textarea>
      <label class="toggle"><input type="checkbox" id="instr"><span class="sw"></span>Instrumental — no vocals</label>
      <button class="btn" id="go">▶&nbsp; Generate</button>
      <div class="hint" id="ghint">Pick a Voice and it sings in your cloned voice automatically. Two takes render per run.</div>
    </section>

    <section class="card">
      <div class="libhead"><h2 style="margin:0">Library</h2><button class="mini" id="refbtn">↻ Refresh</button></div>

      <div class="player" id="player">
        <div class="part" id="part"></div>
        <div class="pmeta"><div class="tt" id="ptitle">—</div><div class="ta" id="partist">commander v1</div></div>
        <button class="play" id="playbtn"><svg id="playicon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <div class="prog">
          <span class="time" id="tcur">0:00</span>
          <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
          <span class="time" id="tdur">0:00</span>
        </div>
        <a class="dl" id="dl" target="_blank" rel="noopener">Open</a>
      </div>

      <div class="tracks" id="tracks"><div class="empty">Loading your tracks…</div></div>
    </section>
  </div>
</div>
<audio id="audio"></audio>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const oai=(typeof window!=="undefined")?window.openai:null;
const BR=!!(oai&&typeof oai.callTool==="function");   // running inside ChatGPT's MCP-Apps bridge
const TKEY="echo_suno_token";
const audio=$("#audio");
const state={account:null,voices:null,tracks:new Map(),current:null};
let lastGenTitle="", lastGenVoice="", polling=false;

/* ---------- small utils ---------- */
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("show"),2600);}
function fmt(s){s=Math.max(0,s|0);return (s/60|0)+":"+String(s%60).padStart(2,"0");}
function grad(id){let h=0;for(const c of (id||""))h=(h*31+c.charCodeAt(0))%360;return "linear-gradient(135deg,hsl("+h+",70%,55%),hsl("+((h+60)%360)+",70%,45%))";}
function artHTML(t){return t.image_url?'<img src="'+t.image_url+'" alt="cover">':'<div style="width:100%;height:100%;background:'+grad(t.id)+'"></div>';}
function lsGet(k){try{return localStorage.getItem(k)||""}catch{return""}}
function reportHeight(){try{if(oai&&typeof oai.notifyIntrinsicHeight==="function")oai.notifyIntrinsicHeight(document.body.scrollHeight);}catch{}}

/* ---------- transport: bridge (callTool) or standalone HTTP (/v1) ---------- */
async function hfetch(path){const r=await fetch(path,{headers:{"x-suno-token":lsGet(TKEY)}});return r.json();}
async function hpost(path,body){const r=await fetch(path,{method:"POST",headers:{"content-type":"application/json","x-suno-token":lsGet(TKEY)},body:JSON.stringify(body)});return r.json();}
function normAcct(s){return {authenticated:!!s.authenticated,name:s.name,credits:s.credits,provider:s.provider,error:s.error,hint:s.hint};}

async function invoke(tool,args){
  args=args||{};
  if(BR){
    let r;
    try{ r=await oai.callTool(tool,args); }
    catch(e){ return {error:String((e&&e.message)||e)}; }
    return (r&&r.structuredContent)?r.structuredContent:(r||{});
  }
  // standalone fallback (GET /panel test page) — normalize to structuredContent shapes
  try{
    if(tool==="suno_status"){return {type:"sunoPanel",account:normAcct(await hfetch("/v1/status"))};}
    if(tool==="suno_voices"){const s=await hfetch("/v1/voices");return {type:"sunoVoices",voices:s.voices||[]};}
    if(tool==="suno_library"){const s=await hfetch("/v1/library");return {type:"sunoLibrary",library:s.clips||[]};}
    if(tool==="suno_job"){const s=await hfetch("/v1/job?ids="+encodeURIComponent((args.ids||[]).join(",")));return {type:"sunoJob",clips:s.clips||[]};}
    if(tool==="suno_generate"){const s=await hpost("/v1/generate",args);return {type:"sunoGenerate",ok:!!s.ok,ids:s.ids||[],error:s.error};}
  }catch(e){ return {error:String((e&&e.message)||e)}; }
  return {};
}

/* ---------- state application (from toolOutput, callTool returns, notifications) ---------- */
function track(id,seed){seed=seed||{};if(!id)return;if(!state.tracks.has(id))state.tracks.set(id,{id,status:"queued",title:seed.title||"",audio_url:null,image_url:null,voice:seed.voice||""});else Object.assign(state.tracks.get(id),seed);}
function mergeClip(c){if(!c||!c.id)return;track(c.id);Object.assign(state.tracks.get(c.id),{status:c.status||state.tracks.get(c.id).status,audio_url:c.audio_url||state.tracks.get(c.id).audio_url,image_url:c.image_url||state.tracks.get(c.id).image_url,title:c.title||state.tracks.get(c.id).title});}

function applyResult(r){
  if(!r||typeof r!=="object")return;
  if(r.account){state.account=r.account;renderAccount();}
  if(Array.isArray(r.voices)){state.voices=r.voices;renderVoices();}
  if(Array.isArray(r.library)){r.library.forEach(mergeClip);render();}
  if(Array.isArray(r.clips)){r.clips.forEach(mergeClip);render();}
  if(r.type==="sunoGenerate"&&r.ok&&Array.isArray(r.ids)){r.ids.forEach(id=>track(id,{title:lastGenTitle||r.title,voice:lastGenVoice||(r.voice&&r.voice.name)}));render();pollLoop();}
  if(r.error){/* surface transient errors quietly */ if(!state.tracks.size&&!state.account)toast(r.error);}
}

/* ---------- rendering ---------- */
function renderAccount(){
  const a=state.account||{};
  $("#acct").textContent=a.authenticated?(a.name||"authenticated"):(a.error?"account error":"not linked");
  $("#hdot").classList.toggle("on",!!a.authenticated);
  $("#credits").textContent=(a.credits!=null)?a.credits:"—";
}
function renderVoices(){
  const sel=$("#voice");const keep=sel.value;
  [...sel.querySelectorAll("option:not(:first-child)")].forEach(o=>o.remove());
  (state.voices||[]).forEach(v=>{const o=document.createElement("option");o.value=v.name||v.id;o.textContent="🎙 "+(v.name||v.id);sel.appendChild(o);});
  if(keep)sel.value=keep;
  if((state.voices||[]).length===0)$("#ghint").innerHTML="No trained voice yet — it'll use a default singer. Train one in Suno → Create → Add Voice, then it appears here.";
}
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
function badge(st){const p=!st||["queued","submitted","streaming"].includes(st);const cls={queued:"b-queued",submitted:"b-submitted",streaming:"b-streaming",complete:"b-complete",error:"b-error"}[st]||"b-queued";const inner=st==="streaming"?'<span class="eq"><i></i><i></i><i></i><i></i></span> streaming':(p?'<span class="spin"></span> ':"")+(st||"queued");return '<span class="badge '+cls+'">'+inner+'</span>';}
function render(){
  const box=$("#tracks");
  if(state.tracks.size===0){box.innerHTML='<div class="empty">No tracks yet — generate one on the left.</div>';reportHeight();return;}
  box.innerHTML="";
  [...state.tracks.values()].reverse().forEach(t=>{
    const el=document.createElement("div");el.className="trk"+(state.current===t.id?" playing":"");el.dataset.id=t.id;
    el.innerHTML='<div class="art">'+artHTML(t)+(t.audio_url?'<div class="pl">'+PLAY+'</div>':'')+'</div>'+
      '<div class="tmeta"><div class="tt">'+(t.title||"Untitled")+'</div><div class="ta">'+(t.voice||"commander v1")+'</div>'+badge(t.status)+'</div>';
    if(t.audio_url)el.addEventListener("click",()=>playTrack(t.id));
    box.appendChild(el);
  });
  reportHeight();
}

/* ---------- player ---------- */
function playTrack(id){
  const t=state.tracks.get(id);if(!t||!t.audio_url)return;
  state.current=id;audio.src=t.audio_url;audio.play().catch(()=>{});
  $("#player").classList.add("up");
  $("#part").innerHTML=artHTML(t);
  $("#ptitle").textContent=t.title||"Untitled";
  $("#partist").textContent=t.voice||"commander v1";
  $("#dl").href=t.audio_url;
  render();
}
function togglePlay(){if(!audio.src)return;audio.paused?audio.play().catch(()=>{}):audio.pause();}
audio.addEventListener("play",()=>{$("#playicon").innerHTML='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';});
audio.addEventListener("pause",()=>{$("#playicon").innerHTML='<path d="M8 5v14l11-7z"/>';});
audio.addEventListener("timeupdate",()=>{const d=audio.duration||0;$("#fill").style.width=(d?audio.currentTime/d*100:0)+"%";$("#tcur").textContent=fmt(audio.currentTime);$("#tdur").textContent=fmt(d);});
audio.addEventListener("ended",()=>{const ids=[...state.tracks.values()].filter(t=>t.audio_url).map(t=>t.id);const i=ids.indexOf(state.current);if(i>-1&&ids[i+1])playTrack(ids[i+1]);});
$("#bar").addEventListener("click",e=>{const r=e.currentTarget.getBoundingClientRect();if(audio.duration)audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;});
$("#playbtn").addEventListener("click",togglePlay);

/* ---------- data loads ---------- */
async function refreshStatus(){applyResult(await invoke("suno_status",{}));}
async function loadVoices(){applyResult(await invoke("suno_voices",{}));}
async function loadLibrary(){applyResult(await invoke("suno_library",{}));if([...state.tracks.values()].some(t=>!t.audio_url||t.status!=="complete"))pollLoop();}

async function pollLoop(){
  if(polling)return;polling=true;
  while(true){
    const pend=[...state.tracks.values()].filter(t=>!t.audio_url||(t.status&&t.status!=="complete"));
    if(!pend.length){polling=false;return;}
    applyResult(await invoke("suno_job",{ids:pend.map(t=>t.id)}));
    await new Promise(r=>setTimeout(r,5000));
  }
}

/* ---------- generate ---------- */
async function generate(){
  const btn=$("#go");const lyr=$("#lyrics").value;
  const body={confirmation:"EXECUTE",title:($("#title").value.trim()||"Untitled"),
    prompt:(lyr.trim()||$("#tags").value.trim()||"song"),lyrics:lyr,custom:lyr.trim().length>0,
    tags:$("#tags").value.trim(),voice:($("#voice").value||undefined),
    audio_influence:Number($("#infl").value),instrumental:$("#instr").checked};
  lastGenTitle=body.title;lastGenVoice=$("#voice").value;
  const label=btn.textContent;btn.disabled=true;btn.textContent="◌  Generating…";
  const r=await invoke("suno_generate",body);
  if(r.error||r.ok===false){toast(r.error==="CONFIRMATION_REQUIRED"?"confirmation required":(r.error||"generate failed"));}
  else{(r.ids||[]).forEach(id=>track(id,{title:body.title,voice:lastGenVoice}));render();pollLoop();toast("Rendering "+(r.ids||[]).length+" take(s)");refreshStatus();}
  btn.disabled=false;btn.textContent=label;
}

/* ---------- wire up ---------- */
$("#infl").addEventListener("input",e=>{$("#inflv").textContent=e.target.value;e.target.style.setProperty("--p",e.target.value+"%");});
$("#go").addEventListener("click",generate);
$("#refbtn").addEventListener("click",loadLibrary);
window.addEventListener("openai:set_globals",e=>{const g=e&&e.detail&&e.detail.globals;if(g&&g.toolOutput)applyResult(g.toolOutput);},{passive:true});
window.addEventListener("message",e=>{if(e.source!==window.parent)return;const m=e.data;if(!m||m.jsonrpc!=="2.0"||m.method!=="ui/notifications/tool-result")return;const d=m.params&&m.params.structuredContent;if(d)applyResult(d);},{passive:true});

/* ---------- boot ---------- */
(function boot(){
  $("#infl").style.setProperty("--p","75%");
  // 1) Seed from the tool result that mounted the widget (bridge mode).
  const out=(BR&&oai&&oai.toolOutput)?oai.toolOutput:null;
  if(out)applyResult(out);
  render();renderAccount();
  // 2) Fill any gaps (works in both bridge and standalone modes).
  if(!state.account||!state.account.authenticated)refreshStatus();
  if(!state.voices)loadVoices();
  if(!state.tracks.size)loadLibrary();
  setInterval(refreshStatus,30000);
  reportHeight();
})();
</script>
</body>
</html>
