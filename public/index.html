<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ECHO Suno Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070c; --ink:#f4f4fb; --dim:#a6a6c2; --faint:#65657f;
  --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.07); --stroke:rgba(255,255,255,.09);
  --pink:#ff2d78; --vio:#8b5cf6; --cy:#22d3ee; --ok:#2ce59b; --warn:#ffcf5c;
  --grad:linear-gradient(100deg,#ff2d78,#8b5cf6 55%,#22d3ee);
  --dock:78px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);
  background-image:
    radial-gradient(900px 500px at 82% -8%,rgba(255,45,120,.20),transparent 60%),
    radial-gradient(760px 520px at 10% 8%,rgba(139,92,246,.20),transparent 60%),
    radial-gradient(700px 700px at 50% 118%,rgba(34,211,238,.14),transparent 55%);
  -webkit-font-smoothing:antialiased;padding-bottom:calc(var(--dock) + 24px);
}
/* subtle grain */
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:30px 22px}
a{color:var(--cy);text-decoration:none}

/* header */
header{display:flex;align-items:center;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px}
.mark{width:46px;height:46px;border-radius:14px;background:var(--grad);display:grid;place-items:center;
  box-shadow:0 10px 34px rgba(139,92,246,.5),inset 0 1px 0 rgba(255,255,255,.4);position:relative;overflow:hidden}
.mark::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.25))}
.mark svg{width:25px;height:25px;color:#0a0a12;position:relative;z-index:1}
.wordmark{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1}
.wordmark b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12px;color:var(--faint);letter-spacing:.03em;margin-top:3px}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:9px;background:var(--glass);backdrop-filter:blur(14px);
  border:1px solid var(--stroke);padding:9px 15px;border-radius:999px;font-size:13px;color:var(--dim)}
.pill b{font-family:'Bricolage Grotesque';color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);transition:.3s}
.dot.on{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.pill.click{cursor:pointer;transition:.15s}.pill.click:hover{border-color:var(--vio);color:var(--ink)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:22px}
@media(max-width:920px){.grid{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--glass2),var(--glass));backdrop-filter:blur(20px);
  border:1px solid var(--stroke);border-radius:22px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.card h2{font-family:'Bricolage Grotesque';font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 18px;display:flex;align-items:center;gap:9px}
.card h2::before{content:"";width:22px;height:3px;border-radius:3px;background:var(--grad)}

label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:15px 0 7px}
input[type=text],textarea,select{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--stroke);color:var(--ink);
  border-radius:13px;padding:12px 14px;font-family:inherit;font-size:14px;outline:none;transition:.16s}
input::placeholder,textarea::placeholder{color:#5a5a72}
input:focus,textarea:focus,select:focus{border-color:var(--vio);box-shadow:0 0 0 4px rgba(139,92,246,.18);background:rgba(0,0,0,.4)}
textarea{min-height:184px;resize:vertical;line-height:1.65;font-size:13.5px}
.row{display:flex;gap:13px}.row>*{flex:1;min-width:0}
.slider{display:flex;align-items:center;gap:12px;height:44px}
input[type=range]{-webkit-appearance:none;height:6px;border-radius:6px;width:100%;
  background:linear-gradient(90deg,var(--vio),var(--cy)) 0/var(--p,80%) 100% no-repeat,rgba(255,255,255,.1)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.6),0 0 0 4px rgba(139,92,246,.3)}
.infl{font-family:'Bricolage Grotesque';font-weight:600;min-width:38px;text-align:right;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.toggle{display:flex;align-items:center;gap:11px;margin-top:8px;color:var(--dim);font-size:13px;cursor:pointer;user-select:none}
.toggle input{display:none}.sw{width:42px;height:23px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;transition:.22s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.22s}
.toggle input:checked+.sw{background:linear-gradient(90deg,var(--pink),var(--vio))}
.toggle input:checked+.sw::after{left:21px}
.btn{margin-top:22px;width:100%;border:none;cursor:pointer;font-family:'Bricolage Grotesque';font-weight:800;
  font-size:16px;letter-spacing:.02em;color:#0b0b14;background:var(--grad);background-size:180% 100%;
  padding:15px;border-radius:15px;transition:.2s;box-shadow:0 14px 40px rgba(255,45,120,.32)}
.btn:hover{background-position:100% 0;transform:translateY(-2px);box-shadow:0 20px 54px rgba(139,92,246,.4)}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.hint{font-size:12px;color:var(--faint);margin-top:12px;line-height:1.5}

/* library */
.libhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.loadrow{display:flex;gap:8px}.loadrow input{flex:1}
.mini{background:var(--glass);border:1px solid var(--stroke);color:var(--dim);border-radius:11px;padding:0 15px;cursor:pointer;font-size:13px;transition:.15s;white-space:nowrap}
.mini:hover{color:var(--ink);border-color:var(--vio)}
.tracks{display:flex;flex-direction:column;gap:11px;max-height:70vh;overflow:auto;margin-top:14px;padding-right:5px}
.tracks::-webkit-scrollbar{width:8px}.tracks::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}
.trk{display:flex;gap:13px;align-items:center;padding:9px;border-radius:16px;border:1px solid transparent;cursor:pointer;transition:.15s}
.trk:hover{background:var(--glass);border-color:var(--stroke)}
.trk.playing{background:linear-gradient(90deg,rgba(255,45,120,.12),rgba(139,92,246,.06));border-color:rgba(139,92,246,.35)}
.art{width:60px;height:60px;border-radius:12px;flex-shrink:0;position:relative;overflow:hidden;
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.art img{width:100%;height:100%;object-fit:cover}
.art .pl{position:absolute;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:center;opacity:0;transition:.15s}
.trk:hover .art .pl{opacity:1}.art .pl svg{width:22px;height:22px;color:#fff}
.tmeta{flex:1;min-width:0}
.tt{font-family:'Bricolage Grotesque';font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-top:5px}
.b-queued,.b-submitted{background:rgba(255,207,92,.15);color:var(--warn)}
.b-streaming{background:rgba(34,211,238,.15);color:var(--cy)}
.b-complete{background:rgba(44,229,155,.15);color:var(--ok)}
.b-error{background:rgba(255,45,120,.15);color:var(--pink)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:13px}
.eq i{width:3px;background:var(--cy);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:3px}50%{height:13px}}
.spin{width:12px;height:12px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--cy);border-radius:50%;display:inline-block;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.empty{color:var(--faint);text-align:center;padding:54px 20px;font-size:14px}

/* now playing dock */
.dock{position:fixed;left:0;right:0;bottom:0;height:var(--dock);z-index:50;transform:translateY(120%);transition:.35s cubic-bezier(.2,.8,.2,1);
  background:rgba(12,12,20,.72);backdrop-filter:blur(26px);border-top:1px solid var(--stroke);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.dock.up{transform:none}
.dockin{max-width:1240px;margin:0 auto;height:100%;display:flex;align-items:center;gap:16px;padding:0 22px}
.dart{width:52px;height:52px;border-radius:11px;flex-shrink:0;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.dart img{width:100%;height:100%;object-fit:cover}
.dmeta{min-width:0;width:190px}
.dmeta .tt{font-size:14px}.dmeta .ta{font-size:11px}
.play{width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;background:var(--grad);color:#0b0b14;display:grid;place-items:center;flex-shrink:0;box-shadow:0 8px 24px rgba(255,45,120,.4);transition:.15s}
.play:hover{transform:scale(1.06)}.play svg{width:22px;height:22px}
.prog{flex:1;display:flex;align-items:center;gap:11px;min-width:0}
.time{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;min-width:38px}
.bar{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.12);cursor:pointer;position:relative;overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--grad);border-radius:6px}
.dl{color:var(--dim);border:1px solid var(--stroke);background:var(--glass);border-radius:10px;padding:8px 12px;font-size:12px;cursor:pointer}
.dl:hover{color:var(--ink);border-color:var(--vio)}
@media(max-width:720px){.dmeta{width:120px}.dl{display:none}}

.toast{position:fixed;bottom:calc(var(--dock) + 18px);left:50%;transform:translateX(-50%) translateY(10px);background:rgba(20,20,32,.95);
  border:1px solid var(--stroke);padding:12px 20px;border-radius:13px;font-size:14px;opacity:0;transition:.28s;pointer-events:none;z-index:60;box-shadow:0 16px 44px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
      <div>
        <div class="wordmark">ECHO <b>Suno Studio</b></div>
        <div class="sub" id="sub">your voice · your tracks</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="pill"><span class="dot" id="hdot"></span><span id="acct">connecting…</span></div>
    <div class="pill">◆ <b id="credits">—</b> credits</div>
    <div class="pill click" id="lockbtn" title="Set your studio token">🔒 <span id="lockstate">token</span></div>
  </header>

  <div class="grid">
    <section class="card">
      <h2>Create</h2>
      <label>Title</label>
      <input id="title" type="text" placeholder="COLD GAME" />
      <div class="row">
        <div><label>Voice</label><select id="voice"><option value="">Default singer</option></select></div>
        <div><label>Audio influence</label><div class="slider"><input id="infl" type="range" min="0" max="100" value="80"><span class="infl" id="inflv">80</span></div></div>
      </div>
      <label>Style / tags</label>
      <input id="tags" type="text" placeholder="hardcore west coast gangsta rap, g-funk, heavy 808 bass, aggressive male vocal" />
      <label>Lyrics <span style="color:var(--faint);text-transform:none;letter-spacing:0">— use [Chorus] / [Verse] markers</span></label>
      <textarea id="lyrics" placeholder="[Chorus]&#10;your bars…&#10;&#10;[Verse 1]&#10;…"></textarea>
      <label class="toggle"><input type="checkbox" id="instr"><span class="sw"></span>Instrumental — no vocals</label>
      <button class="btn" id="go">▶  Generate  ·  10 credits</button>
      <div class="hint" id="ghint">Pick a Voice and it sings in your cloned voice automatically. Two takes render per run.</div>
    </section>

    <section class="card">
      <div class="libhead"><h2 style="margin:0">Library</h2></div>
      <div class="loadrow"><input id="loadid" type="text" placeholder="Paste a Suno clip id to load & play…"><button class="mini" id="loadbtn">Load</button><button class="mini" id="refbtn">↻</button></div>
      <div class="tracks" id="tracks"><div class="empty">Loading your tracks…</div></div>
    </section>
  </div>
</div>

<!-- now playing dock -->
<div class="dock" id="dock">
  <div class="dockin">
    <div class="dart" id="dart"></div>
    <div class="dmeta"><div class="tt" id="dtitle">—</div><div class="ta" id="dartist">commander v1</div></div>
    <button class="play" id="playbtn"><svg id="playicon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
    <div class="prog">
      <span class="time" id="tcur">0:00</span>
      <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
      <span class="time" id="tdur">0:00</span>
    </div>
    <a class="dl" id="dl" download>Download</a>
  </div>
</div>
<audio id="audio"></audio>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const T=new Map(); const KEY="echo_suno_tracks"; const TKEY="echo_suno_token";
let polling=false, current=null;
const audio=$("#audio");

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("show"),2600);}
function saveIds(){localStorage.setItem(KEY,JSON.stringify([...T.keys()]));}
function loadIds(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return[]}}
function getTok(){return localStorage.getItem(TKEY)||"";}
function setTok(){const v=prompt("Enter your Studio token (SUNO_UI_TOKEN). Blank to clear.",getTok());if(v!==null){localStorage.setItem(TKEY,v.trim());$("#lockstate").textContent=v.trim()?"unlocked":"token";toast(v.trim()?"Token saved":"Token cleared");}}
async function api(path,opts){const o=opts||{};o.headers={...(o.headers||{}),"x-suno-token":getTok()};const r=await fetch(path,o);return r.json();}
function fmt(s){s=Math.max(0,s|0);return (s/60|0)+":"+String(s%60).padStart(2,"0");}
function grad(id){let h=0;for(const c of (id||""))h=(h*31+c.charCodeAt(0))%360;return `linear-gradient(135deg,hsl(${h},70%,55%),hsl(${(h+60)%360},70%,45%))`;}
function artHTML(t){return t.image_url?`<img src="${t.image_url}">`:`<div style="width:100%;height:100%;background:${grad(t.id)}"></div>`;}

async function refreshStatus(){try{const s=await api("/v1/status");$("#acct").textContent=s.authenticated?(s.name||"authenticated"):"not authenticated";$("#hdot").classList.toggle("on",!!s.authenticated);if(s.credits!=null)$("#credits").textContent=s.credits;}catch{$("#acct").textContent="operator offline";}}
async function loadVoices(){try{const v=await api("/v1/voices");const sel=$("#voice");[...sel.querySelectorAll("option:not(:first-child)")].forEach(o=>o.remove());(v.voices||[]).forEach(x=>{const o=document.createElement("option");o.value=x.name||x.id;o.textContent="🎙 "+(x.name||x.id);sel.appendChild(o);});if((v.voices||[]).length===0)$("#ghint").innerHTML="No trained voice yet — it'll use a default singer. Train one in Suno → Create → Add Voice, then it appears here.";}catch{}}

function badge(st){const p=!st||["queued","submitted","streaming"].includes(st);const cls={queued:"b-queued",submitted:"b-submitted",streaming:"b-streaming",complete:"b-complete",error:"b-error"}[st]||"b-queued";const inner=st==="streaming"?`<span class="eq"><i></i><i></i><i></i><i></i></span> streaming`:(p?`<span class="spin"></span> `:"")+(st||"queued");return `<span class="badge ${cls}">${inner}</span>`;}
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

function render(){
  const box=$("#tracks");
  if(T.size===0){box.innerHTML='<div class="empty">No tracks yet — generate one on the left.</div>';return;}
  box.innerHTML="";
  [...T.values()].reverse().forEach(t=>{
    const el=document.createElement("div");el.className="trk"+(current===t.id?" playing":"");el.dataset.id=t.id;
    el.innerHTML=`<div class="art">${artHTML(t)}${t.audio_url?`<div class="pl">${PLAY}</div>`:""}</div>
      <div class="tmeta"><div class="tt">${t.title||"Untitled"}</div><div class="ta">${t.voice||"commander v1"}</div>${badge(t.status)}</div>`;
    if(t.audio_url) el.addEventListener("click",()=>playTrack(t.id));
    box.appendChild(el);
  });
}

function playTrack(id){
  const t=T.get(id); if(!t||!t.audio_url)return;
  current=id; audio.src=t.audio_url; audio.play();
  $("#dock").classList.add("up");
  $("#dart").innerHTML=artHTML(t);
  $("#dtitle").textContent=t.title||"Untitled";
  $("#dartist").textContent=t.voice||"commander v1";
  $("#dl").href=t.audio_url; $("#dl").download=(t.title||"track")+".mp3";
  render();
}
function togglePlay(){if(!audio.src)return;audio.paused?audio.play():audio.pause();}
audio.addEventListener("play",()=>$("#playicon").innerHTML='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>');
audio.addEventListener("pause",()=>$("#playicon").innerHTML='<path d="M8 5v14l11-7z"/>');
audio.addEventListener("timeupdate",()=>{const d=audio.duration||0;$("#fill").style.width=(d?audio.currentTime/d*100:0)+"%";$("#tcur").textContent=fmt(audio.currentTime);$("#tdur").textContent=fmt(d);});
audio.addEventListener("ended",()=>{ // autoplay next
  const ids=[...T.values()].filter(t=>t.audio_url).map(t=>t.id);const i=ids.indexOf(current);if(i>-1&&ids[i+1])playTrack(ids[i+1]);});
$("#bar").addEventListener("click",e=>{const r=e.currentTarget.getBoundingClientRect();if(audio.duration)audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;});
$("#playbtn").addEventListener("click",togglePlay);

function track(id,seed={}){if(!T.has(id))T.set(id,{id,status:"queued",title:seed.title||"",audio_url:null,image_url:null,voice:seed.voice||""});else Object.assign(T.get(id),seed);}
async function loadLibrary(){try{const j=await api("/v1/library");(j.clips||[]).forEach(c=>{track(c.id);Object.assign(T.get(c.id),{title:c.title||T.get(c.id).title,status:c.status,audio_url:c.audio_url,image_url:c.image_url});});render();saveIds();if([...T.values()].some(t=>!t.audio_url||t.status!=="complete"))pollLoop();}catch{}}

async function pollLoop(){if(polling)return;polling=true;
  while(true){const pend=[...T.values()].filter(t=>!t.audio_url||(t.status&&t.status!=="complete"));if(!pend.length){polling=false;return;}
    try{const j=await api("/v1/job?ids="+encodeURIComponent(pend.map(t=>t.id).join(",")));const clips=Array.isArray(j)?j:(j.clips||j.items||[]);clips.forEach(c=>{if(T.has(c.id))Object.assign(T.get(c.id),{status:c.status,audio_url:c.audio_url,image_url:c.image_url,title:c.title||T.get(c.id).title});});render();saveIds();}catch{}
    await new Promise(r=>setTimeout(r,5000));}}

async function generate(){
  const btn=$("#go");
  const body={confirmation:"EXECUTE",title:$("#title").value.trim()||"Untitled",lyrics:$("#lyrics").value,custom:$("#lyrics").value.trim().length>0,tags:$("#tags").value.trim(),voice:$("#voice").value||undefined,audio_influence:Number($("#infl").value),instrumental:$("#instr").checked};
  btn.disabled=true;btn.textContent="◌  Generating…";
  try{const r=await api("/v1/generate",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
    if(r.error==="UNAUTHORIZED"){toast("Enter your studio token to generate");setTok();}
    else if(!r.ok){toast("Suno: "+(r.error||"generate failed"));}
    else{(r.ids||[]).forEach(id=>track(id,{title:body.title,voice:$("#voice").value}));render();saveIds();pollLoop();toast("Rendering "+(r.ids||[]).length+" take(s)");refreshStatus();}
  }catch{toast("network error");}
  btn.disabled=false;btn.textContent="▶  Generate  ·  10 credits";
}

$("#infl").addEventListener("input",e=>{$("#inflv").textContent=e.target.value;e.target.style.setProperty("--p",e.target.value+"%");});
$("#go").addEventListener("click",generate);
$("#lockbtn").addEventListener("click",setTok);
$("#loadbtn").addEventListener("click",()=>{const id=$("#loadid").value.trim();if(id){track(id);render();saveIds();pollLoop();$("#loadid").value="";}});
